[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infra-monitor"
version = "0.1.0"
description = "Infrastructure metrics monitoring with psutil and CloudWatch collectors, threshold alerts, HMAC webhooks, and remediation audit log"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sai Asish Y" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "click>=8.1",
    "psutil>=5.9",
    "boto3>=1.34",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "moto[ec2,cloudwatch]>=5.0",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "types-psutil>=5.9",
]

[project.scripts]
infra-monitor = "infra_monitor.cli:main"

[project.urls]
Repository = "https://github.com/SAY-5/infra-monitor"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
infra_monitor = ["dashboard/templates/*.html", "dashboard/static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RET", "TCH"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
exclude = ["tests/", "build/"]

[[tool.mypy.overrides]]
module = ["moto.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: end-to-end tests gated by RUN_INTEGRATION=1",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/infra_monitor"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
]
